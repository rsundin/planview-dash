name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. PlanView Dash is in its **beta for 1.0** (0.9.x): reports now decide what 1.0 fixes, and every one gets an answer within a few days.
        Issues are public: **do not paste access tokens, passwords, addresses or pictures of your home you would not want public.**
        The quickest way here is **Report a problem** (the **?** button) in the dashboard: it fills in the versions and the details below for you. Questions and ideas are welcome in [Discussions](https://github.com/rsundin/planview-dash/discussions).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: PlanView Dash version
      placeholder: "0.9.0"
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: "2026.11.1"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: What does it affect?
      multiple: true
      options:
        - Lights
        - Temperature or heating
        - Energy flow or electricity prices
        - Setup guide or placement mode
        - The card on another dashboard
        - Wall screen (idle, night, doorbell camera, light mode)
        - Something else
  - type: dropdown
    id: device
    attributes:
      label: Where do you open the dashboard?
      multiple: true
      options:
        - Wall tablet or kiosk screen
        - Phone (Companion app)
        - Phone (browser)
        - Tablet (Companion app or browser)
        - Browser on a computer
  - type: textarea
    id: dashboard
    attributes:
      label: From the dashboard
      description: Filled in by **Report a problem** in the dashboard. Versions, browser, screen, modes and counts; no names of rooms or devices.
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → Devices & services → PlanView Dash → ⋮ → **Download diagnostics**, then drag the file here. It holds counts and sizes only.
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: Settings → System → Logs, lines mentioning planview_dash. Remove anything private.
      render: text
